name: Design question
description: An undecided design question that blocks or shapes work (replaces docs/open-questions.md, ADR-0088).
title: "Q-NNN: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the ADRs and design documents do not answer a question
        and guessing would bake in a decision. Title it `Q-NNN: <question>`
        with the next free number: the highest `Q-NNN` among the issues
        labelled `question` and the archive in `docs/open-questions.md`, plus
        one. Mark the place that needs the answer with `[open: #N]` (this
        issue's number). The maintainer answers in a comment; the pull request
        that records the decision (an ADR, a design doc, a crate card) says
        `Closes #N` and removes the markers.

        Not for security problems: report those privately (see SECURITY.md).
  - type: input
    id: blocks
    attributes:
      label: Blocks
      description: What waits for the answer (a phase, a task issue, "nothing yet").
      placeholder: "Phase 3 (rootless overlay)"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: The crates or topic; add the matching `crate:<name>` labels.
      placeholder: "`rnk-sandbox`, `ranikust`"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: One or two paragraphs, with links to where the question was raised (code, ADR, design doc).
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: "(a) …; (b) …, each with its cost for security, then performance."
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: The option you would pick and why, or "none".
    validations:
      required: true
  - type: textarea
    id: interim
    attributes:
      label: Interim
      description: The smallest reversible choice made meanwhile, if any, or "none".
    validations:
      required: true
