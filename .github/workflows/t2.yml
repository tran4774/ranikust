name: T2

# The privileged tiers on GitHub-hosted runners (ADR-0090), with the
# privilege matrix's runner rows, T1 and T2 (ADR-0100): each job is a
# fresh VM GitHub deletes afterwards, with passwordless sudo, so it stands in
# for the local QEMU VM (`just test-vm`) and the VPS container lane (`just
# test-container`). tests/vm/runner.sh refuses to run anywhere else.
#
# Separate from ci.yml: these jobs run with root, through sudo, and take
# longer; ci.yml stays what `just ci` runs. No secrets, a read-only token,
# never pull_request_target: a fork's pull request runs its own code as
# root on a machine of GitHub's, which is what the runner is for.
# Benchmarks (e2e, ultra) and the push suite stay local.
#
# Lanes (ADR-0095): the jobs run only on a full run (a pull request that is
# ready for review, a draft labelled `ci:full`, a manual run with "Run
# workflow" in the Actions tab on any branch, or a push to `main`) and only
# when the change touches the Rust lane or the T2 harness (scripts/ci.py).
# A job skipped by its `if:` reports success, so the gate `T2 result` is the
# one check the `main` ruleset requires. Never `on: paths` here: a workflow
# skipped as a whole leaves its required check pending.
on:
  push:
    branches: [main]
  pull_request:
    # labeled and unlabeled for `ci:full` only; any other label change runs
    # nothing (scripts/ci.py, label_only).
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # As in ci.yml: a run for a label change that changes no lane gets a group
  # of its own and cancels nothing.
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !(github.event.label.name == 'ci:full' && github.event.pull_request.draft) && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      t2: ${{ steps.lanes.outputs.t2 }}
      full: ${{ steps.lanes.outputs.full }}
      label_only: ${{ steps.lanes.outputs.label_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request's base and head commits, for `git diff`.
          fetch-depth: 0
      # ci.yml's `changes` job runs the script's tests.
      - name: Pick the lanes
        id: lanes
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_ACTION: ${{ github.event.action }}
          CI_LABEL: ${{ github.event.label.name }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
          CI_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -I scripts/ci.py changes

  unit:
    # The `#[ignore = "T2: ..."]` and `"T2c: ..."` tests as root on the
    # runner, as `just test-vm unit` runs them in the VM.
    name: T2 unit (root on the runner)
    needs: changes
    if: needs.changes.outputs.t2 == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      # unit and unit-c build the same thing: `cargo-zigbuild test --no-run`
      # for x86_64 musl of the crates holding T2 or T2c tests (today the same
      # six), so they share one cache entry (ADR-0095).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: t2-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # zig compiles the C dependencies for musl through cargo-zigbuild
      # (ADR-0020): the same static binaries the VM runs.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@0.24.0
      # What the VM's base image adds to Ubuntu (tests/vm/vm.sh PACKAGES);
      # Docker is the runner's own.
      - name: Install the VM's packages
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends busybox-static zstd pigz uidmap
      - name: T2 unit
        env:
          RANIKUST_T2_ON_RUNNER: "1"
        run: tests/vm/runner.sh unit
      # On failure or cancellation (a timeout), the suites' logs and results
      # for a week (public, as the job log is; no secrets reach them).
      - name: Keep the results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t2-unit
          path: |
            ~/rnk/out
          if-no-files-found: ignore
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          {
            echo '### T2 unit'
            echo '```'
            cat ~/rnk/out/env.txt ~/rnk/out/summary.txt ~/rnk/out/suite-times.txt 2>/dev/null || echo "no results"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  unit-c:
    # The T2c lane (ADR-0063): the `#[ignore = "T2c: <profile>: ..."]` tests
    # as root in throwaway rootful Docker containers (default, +SYS_ADMIN,
    # +NET_ADMIN), as `just test-container unit-c` runs them on the VPS.
    name: T2c unit-c (rootful Docker on the runner)
    needs: changes
    if: needs.changes.outputs.t2 == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      # Shared with `unit`, which builds the same test binaries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: t2-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@0.24.0
      - name: T2c unit-c
        env:
          RANIKUST_T2_ON_RUNNER: "1"
        run: tests/vm/runner.sh unit-c
      # On failure or cancellation (a timeout), the suites' logs and results
      # for a week (public, as the job log is; no secrets reach them).
      - name: Keep the results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t2c-unit-c
          path: |
            ~/rnk/out
            target/container/results
          if-no-files-found: ignore
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          {
            echo '### T2c unit-c'
            echo '```'
            cat ~/rnk/out/env.txt ~/rnk/out/summary.txt ~/rnk/out/suite-times.txt 2>/dev/null || echo "no results"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  smoke:
    # The ranikust binary and the smoke-build example as root on the runner
    # and in Docker variants (smoke), the quick cases (quick), and kaniko
    # mode on `/` against attacker RUNs (secrets, ADR-0051).
    name: T2 smoke, quick, secrets (root on the runner)
    needs: changes
    if: needs.changes.outputs.t2 == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      # smoke and k8s build the same thing: the ranikust binary and the
      # smoke-build example, static, release (tests/vm/stage.sh), so they
      # share one cache entry, as unit and unit-c do.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: t2-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@0.24.0
      - name: Install the VM's packages
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends busybox-static zstd pigz uidmap
      # The VM's Docker (Ubuntu's docker.io, 29.x) keeps images in
      # containerd's store, Docker 29's default, whose `docker load` reads
      # an OCI layout, as the smoke suite needs; the runner's Docker (28.x)
      # still has the classic store.
      - name: Docker with containerd's image store, as in the VM
        run: |
          f=/etc/docker/daemon.json
          if sudo test -s "$f"; then cur="$(sudo cat "$f")"; else cur='{}'; fi
          jq '.features["containerd-snapshotter"] = true' <<<"$cur" | sudo tee "$f"
          sudo systemctl restart docker
          sudo docker info --format 'storage driver: {{.Driver}} {{.DriverStatus}}'
      - name: T2 smoke, quick, secrets
        env:
          RANIKUST_T2_ON_RUNNER: "1"
        run: tests/vm/runner.sh smoke quick secrets
      # On failure or cancellation (a timeout), the suites' logs and results
      # for a week (public, as the job log is; no secrets reach them).
      - name: Keep the results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t2-smoke-quick-secrets
          path: |
            ~/rnk/out
          if-no-files-found: ignore
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          {
            echo '### T2 smoke, quick, secrets'
            echo '```'
            cat ~/rnk/out/env.txt ~/rnk/out/summary.txt ~/rnk/out/suite-times.txt 2>/dev/null || echo "no results"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  k8s:
    # The Kubernetes rows of the privilege matrix (ADR-0100 rows 7a-7d, #86):
    # the k3s release tests/vm/guest/k8s/pin.env pins, checked against its
    # SHA-256, as a one-node cluster on the runner, and one pod per row
    # running the ranikust binary.
    name: T2 k8s (k3s on the runner)
    needs: changes
    if: needs.changes.outputs.t2 == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      # Shared with `smoke`, which builds the same binaries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: t2-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@0.24.0
      # The pods' image holds the static busybox.
      - name: Install busybox-static
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends busybox-static
      - name: T2 k8s
        env:
          RANIKUST_T2_ON_RUNNER: "1"
        run: tests/vm/runner.sh k8s
      # On failure or cancellation (a timeout), the suite's logs and results,
      # k3s's journal among them, for a week (public, as the job log is; no
      # secrets reach them).
      - name: Keep the results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t2-k8s
          path: |
            ~/rnk/out
          if-no-files-found: ignore
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          {
            echo '### T2 k8s'
            echo '```'
            cat ~/rnk/out/env.txt ~/rnk/out/k8s/env.txt ~/rnk/out/summary.txt ~/rnk/out/suite-times.txt 2>/dev/null || echo "no results"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  matrix-podman:
    # Row 5 of the privilege matrix (ADR-0100, #84): the smoke case
    # tests/smoke/cases/matrix-podman in the runner's rootless Podman, with
    # its default options, as the runner's user (T1: no root).
    name: T1 matrix-podman (rootless Podman on the runner)
    needs: changes
    if: needs.changes.outputs.t2 == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      # Shared with `smoke`, which builds the same binaries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: t2-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@0.24.0
      # Rootless Podman maps the user's ranges with newuidmap and newgidmap.
      - name: Install uidmap
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends uidmap
      - name: T1 matrix-podman
        env:
          RANIKUST_T2_ON_RUNNER: "1"
        run: tests/vm/runner.sh matrix-podman
      # On failure or cancellation (a timeout), the suite's log and the
      # case's outputs for a week (public, as the job log is; no secrets
      # reach them).
      - name: Keep the results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t1-matrix-podman
          path: |
            ~/rnk/out
            ~/rnk/t1/smoke/cases/matrix-podman
          if-no-files-found: ignore
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          {
            echo '### T1 matrix-podman'
            echo '```'
            cat ~/rnk/out/env.txt 2>/dev/null || true
            grep -hE '^(podman |  matrix-podman: env: |measured: |case )' ~/rnk/out/matrix-podman.log 2>/dev/null || true
            cat ~/rnk/out/summary.txt ~/rnk/out/suite-times.txt 2>/dev/null || echo "no results"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  matrix-user:
    # Rows 6 and 6b of the privilege matrix (ADR-0100, #84): the runner's own
    # user under Ubuntu's AppArmor restriction of user namespaces, refused
    # without ranikust's AppArmor profile, then building with it
    # (tests/vm/guest/matrix-user.sh; sudo installs the binary and the
    # profile).
    name: T2 matrix-user (the runner's user)
    needs: changes
    if: needs.changes.outputs.t2 == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      # Shared with `smoke`, which builds the same binaries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: t2-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@0.24.0
      # Rows 6 and 6b: newuidmap and newgidmap.
      - name: Install uidmap
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends uidmap
      - name: T2 matrix-user
        env:
          RANIKUST_T2_ON_RUNNER: "1"
        run: tests/vm/runner.sh matrix-user
      # On failure or cancellation, each leg's log for a week (public, as
      # the job log is; no secrets reach them).
      - name: Keep the results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t2-matrix-user
          path: |
            ~/rnk/out
          if-no-files-found: ignore
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          {
            echo '### T2 matrix-user'
            echo '```'
            cat ~/rnk/out/env.txt ~/rnk/out/matrix-user/env.txt 2>/dev/null || true
            grep -hE '^(--- |measured: |FAIL: )' ~/rnk/out/matrix-user.log 2>/dev/null || true
            cat ~/rnk/out/summary.txt ~/rnk/out/suite-times.txt 2>/dev/null || echo "no results"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # On a push to `main`, after the jobs that save Rust caches: delete each
  # of their cache entries that a newer entry with the same restore key
  # supersedes, as ci.yml's `caches` job does for its own. `main`'s entries
  # only; the names are these jobs' rust-cache names (tests/ci checks them).
  caches:
    name: prune superseded Rust caches
    needs: [unit, unit-c, smoke, k8s, matrix-podman, matrix-user]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete the superseded entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/heads/main --limit 1000 --json id,key,ref,createdAt >"$RUNNER_TEMP/caches.json"
          python3 -I scripts/ci.py stale-caches t2-tests t2-smoke <"$RUNNER_TEMP/caches.json" >"$RUNNER_TEMP/stale.tsv"
          n=0
          while IFS=$'\t' read -r id key; do
            if gh cache delete "$id"; then
              echo "deleted $id $key"
              n=$((n + 1))
            else
              echo "::warning::could not delete cache $id ($key)"
            fi
          done <"$RUNNER_TEMP/stale.tsv"
          echo "$n superseded cache entries deleted"

  # The one required check of this workflow (ADR-0095), named and judged as
  # ci.yml's `CI result` is (see there): `T2 result` only on a full run of a
  # pull request or `main`; a draft, a label change that runs nothing and a
  # manual run on a branch report under other names. A failed `changes` job
  # leaves the name `T2 result` and fails it; `always()`, so a cancelled run
  # leaves a failing gate, never a skipped one.
  result:
    name: ${{ needs.changes.outputs.label_only == 'true' && 'T2 result (label change, nothing run)' || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && 'T2 result (manual run)' || needs.changes.outputs.full == 'false' && 'T2 result (draft, not run)' || 'T2 result' }}
    needs: [changes, unit, unit-c, smoke, k8s, matrix-podman, matrix-user]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if [ "$(jq -r '.changes.result' <<<"$NEEDS")" != success ]; then
            echo "::error::the changes job did not succeed, so the lanes are unknown"
            exit 1
          fi
          # An output that is unset or misspelled would skip its jobs and
          # still pass, and the runner drops an empty output altogether: each
          # expected output, by name, must be "true" or "false".
          if ! jq -e '.changes.outputs as $o | ["t2","full","label_only"] | all($o[.] == "true" or $o[.] == "false")' <<<"$NEEDS" >/dev/null; then
            echo "::error::the changes job's outputs t2, full and label_only are not all true or false, so the lanes are unknown"
            exit 1
          fi
          bad="$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")' <<<"$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::failed or cancelled: $bad"
            exit 1
          fi
