name: Release

# The release process of ADR-0089 and ADR-0092. Pushing a tag `vX.Y.Z` (the
# maintainer only: the `release tags` ruleset) builds the static x86_64
# binary from the tag, packages it with SHA256SUMS, attests its build
# provenance and, after the maintainer approves the `release` environment,
# creates a draft pre-release whose notes are the tag's CHANGELOG.md section.
#
# `workflow_dispatch`, and pull requests that change how a release is made
# (this workflow, its scripts and tests, the toolchain, the locked
# dependencies, the licence configuration), take the dry-run path: test the
# scripts, build, check, package and checksum, without attestation or
# release. The attesting and publishing jobs run only for a pushed `v*` tag.

on:
  push:
    tags: ["v*"]
  pull_request:
    # Not README.md, NOTICE, LICENSE-APACHE or LICENSE-MIT (ADR-0095): the
    # tarball only copies them, so editing one cannot break the build or the
    # package, and a README edit would otherwise build a release from
    # nothing (no cache) on every documentation pull request. A tag packages
    # them as they are then; `just test-release` checks the packaging.
    # This workflow is no required check, so `paths` cannot leave one
    # pending.
    paths:
      - .github/workflows/release.yml
      - .github/release.yml
      - scripts/release.py
      - scripts/check-static.sh
      - scripts/third-party-licenses.hbs
      - licenses/**
      - about.toml
      - deny.toml
      - tests/release/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  # THIRD-PARTY-LICENSES (ADR-0094), in a job of its own with only the
  # source checkout: cargo-about, a third-party binary, never runs where the
  # release binary is built. `cargo metadata`, which it runs, needs every
  # package of Cargo.lock, other targets' too, so they are fetched (checked
  # against Cargo.lock) before cargo-about runs offline; a licence deny.toml
  # does not allow fails the release. `notices` appends the toolchain's
  # notices (licenses/, SHA-256 checked).
  notices:
    name: third-party licence notices
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      # From the action's own manifest, checked against its pinned SHA-256;
      # `fallback: none` fails a version missing from the manifest instead
      # of falling back to cargo-binstall.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - name: Generate THIRD-PARTY-LICENSES
        run: |
          cargo fetch --locked
          cargo about --version
          cargo about generate --frozen --fail -m crates/ranikust/Cargo.toml -c about.toml \
            --target "$TARGET" -o "$RUNNER_TEMP/cargo-about.txt" scripts/third-party-licenses.hbs
          mkdir notices
          python3 -I scripts/release.py notices "$RUNNER_TEMP/cargo-about.txt" notices/THIRD-PARTY-LICENSES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: notices/THIRD-PARTY-LICENSES
          if-no-files-found: error
          retention-days: 30

  build:
    name: build (x86_64 musl)
    needs: notices
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Reads the `release` environment's protection (check-environment).
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.tag.outputs.previous_tag }}
    env:
      BIN: target/x86_64-unknown-linux-musl/release/ranikust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the tag must be on main, the notes start at
          # the previous tag, and the tarball's timestamps come from the
          # tagged commit.
          fetch-depth: 0
      - name: Test the release scripts
        run: |
          bash tests/release/check-static-test.sh
          python3 -I tests/release/test_release.py
      - name: Read the version
        id: version
        run: |
          version="$(python3 -I scripts/release.py version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version"
      # Everything that can stop a release is checked here, before the
      # build, the attestation and the approval.
      - name: Check the tag, its changelog section and the release environment
        id: tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/release.py check-tag "$TAG"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main: release only a merged release pull request"
            exit 1
          fi
          python3 -I scripts/release.py notes "$VERSION" > /dev/null
          # A job naming a missing environment creates it unprotected.
          python3 -I scripts/release.py check-environment "$GITHUB_REPOSITORY" release
          previous="$(python3 -I scripts/release.py previous-tag "$TAG")"
          echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"
          echo "previous release tag: ${previous:-none}"
      - name: Report the release environment (dry run, informational)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out="$(python3 -I scripts/release.py check-environment "$GITHUB_REPOSITORY" release 2>&1)"; then
            echo "$out"
          else
            echo "::notice::a tag would stop here: $out"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install
      # No cache at all: a release is built from nothing but the tagged
      # source, the pinned toolchain and the locked dependencies, so nothing
      # an earlier run stored can reach it (ADR-0089, ADR-0092). The same
      # tool versions as CI's `static-build` job (ADR-0020); Zig comes from
      # ziglang.org with a pinned checksum, since mlugg/setup-zig restores
      # its archive from the Actions cache whatever `use-cache` says.
      - name: Install Zig (pinned checksum, no cache)
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          archive="$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$archive" \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
      # Downloads a release binary and checks it against the action's own
      # pinned SHA-256; uses no cache; no cargo-binstall fallback.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-zigbuild@0.24.0
          fallback: none
      - name: Build
        run: |
          test "$(zig version)" = 0.16.0
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=cc cargo zigbuild --release --locked --target "$TARGET" -p ranikust
      - name: Check that the binary is static-pie and runs
        run: scripts/check-static.sh "$BIN"
      - name: Check that the binary reports the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          reported="$("$BIN" version)"
          if [ "$reported" != "ranikust $VERSION" ]; then
            echo "::error::the binary reports '$reported', expected 'ranikust $VERSION'"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: ${{ runner.temp }}/notices
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            python3 -I scripts/release.py package "$BIN" "$RUNNER_TEMP/notices/THIRD-PARTY-LICENSES" "$VERSION" dist
          cat dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # As long as a deployment may wait for approval (30 days).
          retention-days: 30

  # A job of its own, so the OIDC token that signs the attestation is never
  # available to the build (and its build scripts). Only for a pushed `v*`
  # tag: the trigger allows no other push, and the condition says it again.
  attest:
    name: attest build provenance
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  publish:
    name: draft the GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The maintainer approves this environment before anything is published.
    # It must exist, protected, before the first tag (ADR-0092): the build
    # job refuses to go on otherwise, and the first step checks it again.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/release.py check-environment "$GITHUB_REPOSITORY" release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Take the notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 -I scripts/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS: ${{ needs.build.outputs.previous_tag }}
        run: |
          # Every release before 1.0, and every X.Y.Z-suffix, is a pre-release.
          prerelease=()
          case "$VERSION" in
            0.*|*-*) prerelease=(--prerelease) ;;
          esac
          # The generated list starts at the previous release tag on the
          # tag's history, not at GitHub's guess among pre-releases.
          start=()
          if [ -n "$PREVIOUS" ]; then
            start=(--notes-start-tag "$PREVIOUS")
          fi
          # The CHANGELOG section comes first; GitHub appends the merged pull
          # requests, grouped by the labels of .github/release.yml.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            "${prerelease[@]}" \
            --title "ranikust $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${start[@]}"
