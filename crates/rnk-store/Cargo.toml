[package]
name = "rnk-store"
description = "Persistent content-addressed store: blobs, extracted layers, cache mounts, locks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rnk-oci.workspace = true
rnk-rootfs.workspace = true
# `process`: `geteuid`, for the warning about a shared state directory.
rustix = { workspace = true, features = ["fs", "process"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rnk-metrics.workspace = true
# `mount`: the T2 test that puts a bind mount where clean-up deletes.
rustix = { workspace = true, features = ["mount", "process"] }
tempfile.workspace = true
