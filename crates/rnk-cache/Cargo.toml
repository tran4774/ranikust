[package]
name = "rnk-cache"
description = "Layer cache: cache keys, lookup and push"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes.workspace = true
# The digests and the platform a key names, and the entry's documents
# (ADR-0115).
rnk-oci.workspace = true
# The registry cache's transfers (ADR-0115).
rnk-registry.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `base64`, `futures-util`, `http-body-util`, `hyper`, `hyper-util`: the fake
# registry of `rnk-registry`'s tests, compiled into this crate's tests.
base64.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
proptest.workspace = true
rnk-metrics.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
