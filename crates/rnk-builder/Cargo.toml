[package]
name = "rnk-builder"
description = "Stage builder: executes a stage's instructions and assembles the image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes.workspace = true
futures-util.workspace = true
rnk-context.workspace = true
rnk-dockerfile.workspace = true
rnk-ignore.workspace = true
rnk-layer.workspace = true
rnk-oci.workspace = true
rnk-registry.workspace = true
rnk-rootfs.workspace = true
rnk-sandbox.workspace = true
rnk-snapshot.workspace = true
rnk-store.workspace = true
# Listing a directory of a root, by fd, for `COPY --from` wildcards.
rustix.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `tempfile`: uniquely named, exclusively created temporary files beside
# each output and encoded layer, renamed into place.
tempfile.workspace = true
thiserror.workspace = true
# `rt`: pulls run the store's blocking fills on blocking threads.
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
# `base64`, `http-body-util`, `hyper`, `hyper-util`: the fake
# registry of `rnk-registry`'s tests, compiled into this crate's push tests.
base64.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rnk-metrics.workspace = true
# `tar`: reading the Docker tarball back in tests.
tar.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
