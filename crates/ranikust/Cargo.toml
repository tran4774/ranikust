[package]
name = "ranikust"
description = "Container image builder that ships as one static binary and runs inside or outside containers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Depends on unpublished workspace crates, like every crate here.
publish = false

[dependencies]
clap.workspace = true
mimalloc.workspace = true
rnk-metrics.workspace = true
rnk-rootfs.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
# The crates `examples/smoke-build.rs` strings together until `rnk-builder`
# exists.
rnk-layer.workspace = true
rnk-oci.workspace = true
rnk-registry.workspace = true
rnk-sandbox.workspace = true
rustix = { workspace = true, features = ["fs"] }
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[example]]
name = "smoke-build"
path = "examples/smoke-build.rs"

[lints]
workspace = true
