[package]
name = "rnk-snapshot"
description = "Per-stage root filesystems and their per-instruction diffs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rnk-layer.workspace = true
rnk-oci.workspace = true
rnk-rootfs.workspace = true
rnk-store.workspace = true
# `mount`: overlay mounts (`fsopen`, `fsconfig`, `fsmount`, `move_mount`,
# `mount(2)`, `umount2`).
rustix = { workspace = true, features = ["mount"] }
# Short names of the `mount(2)` fallback, from the lower's path.
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# gzip layer blobs in the extraction tests.
flate2.workspace = true
rnk-metrics.workspace = true
# `process`: the umask in the exporter's tests.
rustix = { workspace = true, features = ["mount", "process"] }
# Reading exported layers back in tests.
tar.workspace = true
tempfile.workspace = true
