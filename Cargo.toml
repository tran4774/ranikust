[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Kept equal to the channel in `rust-toolchain.toml`.
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tran4774/ranikust"

[workspace.dependencies]
# Internal crates, referenced as `<name>.workspace = true`.
rnk-dockerfile = { path = "crates/rnk-dockerfile" }
rnk-ignore = { path = "crates/rnk-ignore" }
rnk-layer = { path = "crates/rnk-layer" }
rnk-metrics = { path = "crates/rnk-metrics" }
rnk-oci = { path = "crates/rnk-oci" }
rnk-registry = { path = "crates/rnk-registry" }
rnk-rootfs = { path = "crates/rnk-rootfs" }
rnk-sandbox = { path = "crates/rnk-sandbox" }
rnk-snapshot = { path = "crates/rnk-snapshot" }
rnk-store = { path = "crates/rnk-store" }

# Third-party crates. Each is an architecture change: say why in the commit
# that adds it.
#
# `base64`: the `auth` field of docker `config.json`.
base64 = "0.22.1"
# `bytes`: the body type `oci-client` and `reqwest` stream.
bytes = "1.10"
# `clap`: the command line (Q-012); no colour, so help and errors are the
# same on every terminal.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# `flate2`: pure-Rust zlib (zlib-rs), so the musl build needs no C
# toolchain; `runtime_detection` lets zlib-rs pick SIMD code at run time.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
# `futures-util`: adapting a reader to the stream `oci-client` pushes.
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
# `http-auth`: `WWW-Authenticate` parsing for the identity-token exchange;
# the parser `oci-client` already uses.
http-auth = { version = "0.1.10", default-features = false }
# `libc`: syscalls rustix 1.1 has no wrapper for: `getrusage` (metrics),
# `clone` with namespace flags, `wait4`, `execve` and the capability
# `prctl`s (`rnk-sandbox`).
libc = "0.2.186"
# `mimalloc`: the binary's allocator; musl's is 250–300× slower under threads (exp-05).
mimalloc = { version = "0.1.52", default-features = false }
# `oci-client`: the distribution API under `rnk-registry`; its default
# `rustls-tls` feature would select `aws-lc-rs` (ADR-0024).
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls-no-provider"] }
# `regex`: no Unicode tables; `rnk-ignore` writes its classes out itself.
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
# `reqwest`: the identity-token exchange `oci-client` lacks; the version and
# TLS set-up `oci-client` uses, no default crypto provider.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "form", "json"] }
# `rustls` with `ring`: the process-wide crypto provider `reqwest` needs
# (ADR-0024).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# `rustls-native-certs`: the host CA bundle, `SSL_CERT_FILE`, `SSL_CERT_DIR`.
rustls-native-certs = "0.8.5"
# `rustls-pki-types`: PEM parsing of `--registry-certificate` files.
rustls-pki-types = { version = "1.12", features = ["std"] }
rustix = { version = "1.1.6", features = ["fs", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# `sha2`: SHA-NI and ARMv8 SHA picked at run time, no asm or C.
sha2 = { version = "0.11.1", default-features = false }
# `tar`: reading only (`entries()`, never `unpack`); writers build headers.
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
# `tokio`: the runtime `oci-client` runs on; libraries never start one.
tokio = { version = "1.52", default-features = false, features = ["fs", "io-util", "sync", "time"] }
# `tokio-util`: `ReaderStream`, a file as a push body.
tokio-util = { version = "0.7.16", default-features = false, features = ["io"] }
# `tracing`: libraries emit spans only; `rnk-metrics` and the binary
# install the subscriber (ADR-0025).
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
# `webpki-root-certs`: embedded public roots as DER certificates (ADR-0024).
webpki-root-certs = "1.0.11"
# `zstd`: bundled libzstd built by cargo-zigbuild (ADR-0020); no legacy formats or dictionary training.
zstd = { version = "0.14.3", default-features = false }

# Test-only crates.
# `hyper`, `hyper-util`, `http-body-util`: the in-process fake registry in
# `rnk-registry`'s tests; already in the tree through `reqwest`.
http-body-util = "0.1.3"
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# Keep each crate's public surface explicit: items that are not reachable from
# the crate root must be `pub(crate)`.
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# The default groups (correctness, suspicious, style, complexity, perf) stay
# on. The lints below are picked one by one from `pedantic` and `restriction`.
#
# Syscall-heavy code: every `unsafe` block needs a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
# Every `#[allow]`/`#[expect]` must say why.
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
# One module layout: `foo.rs` + `foo/`, never `foo/mod.rs`.
mod_module_files = "warn"
# Sizes, offsets, uids, gids and modes cross many integer types; silent
# truncation or sign changes there are bugs. Prefer `From`/`TryFrom`.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
# Abort instead of unwinding: smaller and faster binary. Cleanup must not rely
# on unwinding anyway, because the build has to survive SIGKILL and OOM kills
# (mounts live in a private mount namespace, `RUN` children get
# PR_SET_PDEATHSIG, stub mountpoints are journaled before creation). The cost
# is that a panic in any thread or task ends the whole process instead of
# surfacing as a `JoinError`; panics are bugs, not error handling.
panic = "abort"
# Strip debug info but keep the symbol table, so panic backtraces from user
# reports stay readable.
strip = "debuginfo"
