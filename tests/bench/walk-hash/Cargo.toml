# Benchmark of the Phase 2 dependency candidates (Q-038): the snapshot
# hash and the parallel walk. Not a workspace member and never shipped;
# `run.sh` builds and runs it.
[package]
name = "walk-hash-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
highway = "1.3.0"
jwalk = "0.9.0"
mimalloc = { version = "0.1.52", default-features = false }
rayon = "1.12.0"
rustix = { version = "1.1.6", features = ["fs", "process", "std"] }
sha2 = "0.11.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.release]
codegen-units = 1
lto = "thin"
